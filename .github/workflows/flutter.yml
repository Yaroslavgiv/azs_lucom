name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Verify self-contained dependencies
        run: |
          if grep -Eq '^\s+path:\s+\.\.' pubspec.yaml; then
            echo 'Local path dependencies are not allowed.' >&2
            exit 1
          fi

      - name: Verify maintenance scripts
        run: python -m compileall -q scripts

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test packages

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Build Android debug APK
        run: flutter build apk --debug
