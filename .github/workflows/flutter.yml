name: Flutter CI

on:
  push:
    branches: [main, agent/self-contained-map]
  pull_request:

permissions:
  contents: write

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Verify self-contained dependencies
        run: |
          if grep -Eq '^\s+path:\s+\.\.' pubspec.yaml; then
            echo 'Local path dependencies are not allowed.' >&2
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Apply canonical formatting
        run: dart format lib test

      - name: Commit generated files
        if: github.ref == 'refs/heads/agent/self-contained-map'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_options.yaml pubspec.lock lib test
          git commit -m "Apply Dart formatting and refresh lockfile"
          git push

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Build Android debug APK
        run: flutter build apk --debug
